[package]
name = "provisioning-proto"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Wire format and crypto for provisioning WiFi credentials to an ESP32 over BLE"

[features]
default = []
# Sender side (the browser): sealing needs an RNG for the ephemeral key and the
# pairing secret. The device only opens, so it doesn't enable this.
seal = ["hpke/getrandom", "dep:getrandom"]

[dependencies]
# The endpoint's own key types. The ed25519 keys underneath (ed25519-dalek) also
# provide the X25519 conversion HPKE needs.
iroh-base = { version = "1.3", default-features = false, features = ["key"] }
hpke = { version = "0.14", default-features = false, features = ["x25519", "chacha", "alloc"] }
# All wire and storage formats.
postcard = { version = "1.1.1", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
# Pairing tickets.
data-encoding = "2"
# Pairing secrets (sender side only).
getrandom = { version = "0.4", optional = true }

[dev-dependencies]
hpke = { version = "0.14", default-features = false, features = ["getrandom"] }
