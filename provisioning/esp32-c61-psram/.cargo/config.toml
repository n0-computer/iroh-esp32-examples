[build]
# ESP32-C61: single-core 32-bit RISC-V (RV32IMAC — has the `a` atomics extension,
# unlike the C3's imc). Same rust target as the C6/C5/H2. Keep MCU in [env] below
# in sync with this target.
target = "riscv32imac-esp-espidf"

[target.riscv32imac-esp-espidf]
linker = "ldproxy"
# `--after no-reset`: let the monitor do the only reset. espflash's default resets
# after flashing and the monitor resets again during that first boot; on the C61
# that leaves the ROM in a watchdog loop (rst:0x7 TG0_WDT) until a power cycle.
runner = "espflash flash --after no-reset --monitor"
rustflags = [ "--cfg",  "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]
# Build std/core/alloc with size-first codegen. Behavior-neutral; ~181 KB off
# .flash.text. Keep this on.
build-std-features = ["optimize_for_size"]

[env]
MCU="esp32c61"
# Note: this variable is not used by the pio builder (`cargo build --features pio`)
# ESP32-C61 became a stable ESP-IDF target in v5.5.2; pin the latest v5.5 patch.
ESP_IDF_VERSION = "v5.5.4"
