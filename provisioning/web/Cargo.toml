[package]
name = "provisioning-web"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Browser page for provisioning iroh devices over Web Bluetooth"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to the installed `wasm-bindgen` CLI (0.2.126), like wasm-gui. The crate and
# CLI versions MUST match exactly or the generated JS bindings are rejected.
wasm-bindgen = "=0.2.126"
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
# Async exports (connect_device, Device::provision) become JS promises.
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["BluetoothDevice", "BluetoothRemoteGattServer", "EventTarget"] }
iroh-provision = { path = "../iroh-provision", features = ["client"] }
iroh-provision-ble = { path = "../iroh-provision-ble", features = ["web"] }
# HPKE's ephemeral key and the pairing secret need randomness; on wasm32 route it
# to crypto.getRandomValues.
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "z"   # optimize for size — wasm ships over the wire
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
