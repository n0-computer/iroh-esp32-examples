[package]
name = "provisioning-web"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Browser client for BLE WiFi provisioning: Web Bluetooth in JS, sealing in Rust/wasm"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to the installed `wasm-bindgen` CLI (0.2.126), like wasm-gui. The crate and
# CLI versions MUST match exactly or the generated JS bindings are rejected.
wasm-bindgen = "=0.2.126"
console_error_panic_hook = "0.1.7"
provisioning-proto = { path = "../proto", features = ["seal"] }
iroh-base = { version = "1.3", default-features = false, features = ["key"] }
# HPKE's ephemeral key needs randomness; on wasm32 route it to crypto.getRandomValues.
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "z"   # optimize for size — wasm ships over the wire
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
