[package]
name = "esp32-echo-client"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# iroh from crates.io — proves the ESP32 server works with stock iroh

[dependencies]
iroh = "1.3.0"
iroh-tickets = "1.0.0"
# mDNS local discovery. Native target (ring + working SO_REUSEPORT), so the stock
# crates.io release works unpatched — no [patch] needed, unlike the ESP32 servers.
iroh-mdns-address-lookup = "0.4.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
